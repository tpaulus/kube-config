---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databasus
  namespace: argocd
spec:
  destination:
    namespace: databasus
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: databasus
    repoURL: ghcr.io/databasus/charts
    targetRevision: 3.73.1
    helm:
      values: |
        image:
          repository: ghcr.io/databasus/databasus
        ingress:
          enabled: true
          className: traefik
          hosts:
            - host: databasus.ing.k3s.brickyard.whitestar.systems
              paths:
                - path: /
                  pathType: Prefix
        extraEnv:
          - name: IS_DISABLE_ANONYMOUS_TELEMETRY
            value: "true"
          - name: SMTP_HOST
            value: smtp-relay.smtp-relay.svc.cluster.local
          - name: SMTP_PORT
            value: "25"
          - name: SMTP_SECURITY
            value: none
          - name: SMTP_FROM
            value: databasus@whitestar.systems
          - name: DATABASUS_URL
            value: https://databasus.ing.k3s.brickyard.whitestar.systems
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
