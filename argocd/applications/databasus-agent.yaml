---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databasus-agent
  namespace: argocd
spec:
  destination:
    namespace: databasus
    server: https://kubernetes.default.svc
  project: default
  source:
    path: databasus-agent
    repoURL: git@github.com:tpaulus/kube-config.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
