apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  destination:
    namespace: immich
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: git@github.com:tpaulus/kube-config.git
      path: immich
      targetRevision: HEAD
    - repoURL: ghcr.io/immich-app/immich-charts
      chart: immich
      targetRevision: 0.13.4
      helm:
        releaseName: immich
        values: |
          controllers:
            main:
              containers:
                main:
                  image:
                    tag: v3.4.0
          server:
            defaultPodOptions:
              securityContext:
                runAsUser: 3000
                runAsGroup: 3000
                runAsNonRoot: true
            controllers:
              main:
                pod:
                  annotations:
                    prometheus.io/scrape: "true"
                    prometheus.io/port: "9081"
                    prometheus.io/path: "/metrics"
                    prometheus.io/microservices-port: "9082"
                containers:
                  # Workaround for https://github.com/immich-app/immich/issues/33173
                  # Immich 3.4.0 metrics exporters bind to localhost only (8081/8082);
                  # proxy them onto the pod IP. Remove, and restore the 8081/8082
                  # annotations, once fixed upstream.
                  metrics-api-proxy:
                    image:
                      repository: alpine/socat
                      tag: 1.8.0.3
                    args:
                      - TCP-LISTEN:9081,fork,reuseaddr
                      - TCP:127.0.0.1:8081
                  metrics-microservices-proxy:
                    image:
                      repository: alpine/socat
                      tag: 1.8.0.3
                    args:
                      - TCP-LISTEN:9082,fork,reuseaddr
                      - TCP:127.0.0.1:8082
                  main:
                    env:
                      IMMICH_TELEMETRY_INCLUDE: all
                      DB_HOSTNAME: immich-postgres
                      DB_PORT: "5432"
                      DB_USERNAME:
                        valueFrom:
                          secretKeyRef:
                            name: immich-db
                            key: username
                      DB_DATABASE_NAME:
                        valueFrom:
                          secretKeyRef:
                            name: immich-db
                            key: database
                      DB_PASSWORD:
                        valueFrom:
                          secretKeyRef:
                            name: immich-db
                            key: password
          immich:
            persistence:
              library:
                existingClaim: immich-library
          valkey:
            enabled: true
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
