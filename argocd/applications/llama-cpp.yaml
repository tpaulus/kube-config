---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llama-cpp
spec:
  destination:
    namespace: llama-cpp
    server: https://kubernetes.default.svc
  source:
    path: llama-cpp
    repoURL: git@github.com:tpaulus/kube-config.git
    targetRevision: HEAD
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions: [CreateNamespace=true]
