---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-bunny
  namespace: argocd
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: cert-manager-webhook-bunny
    repoURL: ghcr.io/aardbol/charts
    targetRevision: 1.4.2
    helm:
      values: |
        secretAccess:
          names:
            - bunny-acme-api-token
  syncPolicy:
    automated:
      prune: true
    syncOptions: [CreateNamespace=true]
