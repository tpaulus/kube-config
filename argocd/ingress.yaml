---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: webhook-no-client-cert
  namespace: argocd
spec:
  minVersion: VersionTLS12
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints: [websecure, web-mtls]
  routes:
    - kind: Rule
      match: Host(`argocd.ing.k3s.brickyard.whitestar.systems`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.ing.k3s.brickyard.whitestar.systems`) && Header(`Content-Type`,
        `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: github-webhook-ip-allowlist
  namespace: argocd
spec:
  ipAllowList:
    # Fail closed until the first successful GitHub metadata sync.
    sourceRange: ["127.0.0.1/32", "::1/128"]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-webhook
  namespace: argocd
  annotations:
    external-dns.kubernetes.io/target: lfp.it.paulus.family
spec:
  entryPoints: [web-mtls]
  routes:
    - kind: Rule
      match: Host(`argocd-webhook.ing.k3s.brickyard.whitestar.systems`) &&
        Path(`/api/webhook`)
      middlewares:
        - name: github-webhook-ip-allowlist
      services:
        - name: argocd-server
          port: 80
  tls:
    options:
      name: webhook-no-client-cert
      namespace: argocd
