---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: webhook-no-client-cert
  namespace: argocd
spec:
  minVersion: VersionTLS12
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints: [websecure, web-mtls]
  routes:
    - kind: Rule
      match: Host(`argocd.ing.k3s.brickyard.whitestar.systems`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.ing.k3s.brickyard.whitestar.systems`) && Header(`Content-Type`,
        `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: github-webhook-ip-allowlist
  namespace: argocd
spec:
  ipAllowList:
    sourceRange: []
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-webhook
  namespace: argocd
spec:
  entryPoints: [web-mtls]
  routes:
    - kind: Rule
      match: Host(`argocd-webhook.ing.k3s.brickyard.whitestar.systems`) &&
        Path(`/api/webhook`)
      middlewares:
        - name: github-webhook-ip-allowlist
      services:
        - name: argocd-server
          port: 80
  tls:
    options:
      name: webhook-no-client-cert
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jwt-verification
  namespace: argocd
spec:
  plugin:
    jwt:
      issuers: ["https://whitestar.cloudflareaccess.com/cdn-cgi/access/certs"]
      headerName: Cf-Access-Jwt-Assertion
      require:
        aud: f2d6259e0bc9268137d8382a2b145834130153c17ddefae081fa8e4c60603998
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-ext
  namespace: argocd
spec:
  entryPoints: [web-ext, web-mtls]
  routes:
    - kind: Rule
      match: Host(`argocd.auth-ing.k3s.brickyard.whitestar.systems`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.auth-ing.k3s.brickyard.whitestar.systems`) && Header(`Content-Type`,
        `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
