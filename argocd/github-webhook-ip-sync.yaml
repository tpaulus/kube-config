---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-webhook-ip-sync
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-webhook-ip-sync
  namespace: argocd
rules:
  - apiGroups: [traefik.io]
    resources: [middlewares]
    resourceNames: [github-webhook-ip-allowlist]
    verbs: [patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [github-webhook-ip-sync]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-webhook-ip-sync
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: github-webhook-ip-sync
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-webhook-ip-sync
---
apiVersion: batch/v1
kind: Job
metadata:
  name: github-webhook-ip-sync-postsync
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: github-webhook-ip-sync
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
        - name: trigger
          image: alpine/k8s:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              name="github-webhook-ip-sync-run-$(date +%s)"
              kubectl -n argocd create job --from=cronjob/github-webhook-ip-sync "${name}"
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-webhook-ip-sync
  namespace: argocd
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: github-webhook-ip-sync
          restartPolicy: OnFailure
          dnsConfig:
            nameservers: [1.1.1.1, 1.0.0.1]
          dnsPolicy: None
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              command: [/bin/sh, -ec]
              args:
                - |
                  response="$(curl --fail --silent --show-error https://api.github.com/meta)"
                  hooks="$(printf '%s' "$response" | tr '\n' ' ' | sed -n 's/.*"hooks"[[:space:]]*:[[:space:]]*\[\([^]]*\)\].*/\1/p' | tr -d '"' | tr -d '[:space:]' | tr ',' ' ')"
                  test -n "$hooks"
                  ranges=
                  for cidr in $hooks; do
                    ranges="${ranges}${ranges:+,}\"${cidr}\""
                  done
                  token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  auth="$(printf '%s %s' Bearer "$token")"
                  curl --fail --silent --show-error \
                    --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                    -H "Authorization: ${auth}" \
                    -H 'Content-Type: application/merge-patch+json' \
                    --data "{\"spec\":{\"ipAllowList\":{\"sourceRange\":[${ranges}]}}}" \
                    -X PATCH \
                    "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}/apis/traefik.io/v1alpha1/namespaces/argocd/middlewares/github-webhook-ip-allowlist"
