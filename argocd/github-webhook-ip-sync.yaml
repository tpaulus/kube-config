---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-webhook-ip-sync
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-webhook-ip-sync
  namespace: argocd
rules:
  - apiGroups: [traefik.io]
    resources: [middlewares]
    resourceNames: [github-webhook-ip-allowlist]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-webhook-ip-sync
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: github-webhook-ip-sync
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-webhook-ip-sync
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-webhook-ip-sync
  namespace: argocd
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: github-webhook-ip-sync
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
              command: [/bin/sh, -ec]
              args:
                - |
                  response="$(curl --fail --silent --show-error https://api.github.com/meta)"
                  hooks="$(printf '%s' "$response" | tr '\n' ' ' | sed -n 's/.*"hooks"[[:space:]]*:[[:space:]]*\[\([^]]*\)\].*/\1/p' | tr -d '"' | tr -d '[:space:]' | tr ',' ' ')"
                  test -n "$hooks"
                  ranges=
                  for cidr in $hooks; do
                    ranges="${ranges}${ranges:+,}\"${cidr}\""
                  done
                  token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  auth="$(printf '%s %s' Bearer "$token")"
                  curl --fail --silent --show-error \
                    --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                    -H "Authorization: ${auth}" \
                    -H 'Content-Type: application/merge-patch+json' \
                    --data "{\"spec\":{\"ipAllowList\":{\"sourceRange\":[${ranges}]}}}" \
                    -X PATCH \
                    https://kubernetes.default.svc/apis/traefik.io/v1alpha1/namespaces/argocd/middlewares/github-webhook-ip-allowlist
