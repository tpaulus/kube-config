---
groups:
  - name: Node
    rules:
      - alert: NodeRebootRequired
        expr: node_reboot_required == 1
        for: 24h
        labels:
          severity: warning
          notify: todoist email-tom
        annotations:
          title: Node {{ $labels.instance }} requires a reboot
          description: Node {{ $labels.instance }} has required a reboot continuously
            for 24 hours. Automatic reboot may have failed; investigate the host.
      - alert: MDRAID degraded
        expr: (node_md_disks - node_md_disks{state="active"}) != 0
        for: 1m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          title: MDRAID on node {{ $labels.instance }} is in degrade mode
          description: 'Degraded RAID array {{ $labels.device }} on {{ $labels.instance }}:
            {{ $value }} disks failed'
      - alert: Disk Usage High
        expr: max(1 - node_filesystem_free_bytes{device!~"tmpfs|tank/TimeMachine/.*"} / node_filesystem_size_bytes{device!~"tmpfs|tank/TimeMachine/.*"})
          by (device, instance) > .80
        for: 5m
        labels:
          severity: high
        annotations:
          title: Node {{ $labels.instance }} {{ $labels.device }} is over 80% utilized
      - alert: Disk Usage Critical
        expr: max(1 - node_filesystem_free_bytes{device!~"tmpfs|tank/TimeMachine/.*"} / node_filesystem_size_bytes{device!~"tmpfs|tank/TimeMachine/.*"})
          by (device, instance) > .95
        for: 5m
        labels:
          severity: critical
          notify: todoist email-tom
        annotations:
          title: Node {{ $labels.instance }} {{ $labels.device }} is over 95% utilized
      # pint disable promql/regexp
      - alert: Node down
        expr: up{instance=~"[0-9.]+:9100", netbox_device_name!=""} == 0
        for: 3m
        labels:
          severity: high
          notify: todoist email-tom
          instance: '{{ toLower $labels.netbox_device_name }}'
          netbox_instance: '{{ $labels.instance }}'
        annotations:
          title: Node {{ $labels.netbox_device_name }} is down
          description: Failed to scrape Node Exporter on {{ $labels.netbox_device_name }}
            for more than 3 minutes. Node seems down.
