---
groups:
  - name: ShareBackups
    rules:
      - alert: Share Backup Missing
        expr: time() - max(b2_backup_completed{}) by (share, bucket_name) > 14400
        for: 1m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.share }} Not Being Backed Up'
          description: It has been over 4 hours since {{ $labels.share }} has been
            backed up to the B2 Bucket {{ $labels.bucket_name }}
          dashboard: https://grafana.brickyard.whitestar.systems/d/p1er_aLVk/backups?orgId=1
      - alert: Share Cleanup Missing
        expr: time() - max(b2_cleanup_completed{}) by (share, bucket_name) > 21600
        for: 1m
        labels:
          severity: low
        annotations:
          summary: '{{ $labels.share }} Not Being Cleaned Up'
          description: It has been over 6 hours since {{ $labels.share }} has been
            cleaned up against the B2 Bucket {{ $labels.bucket_name }}
          dashboard: https://grafana.brickyard.whitestar.systems/d/p1er_aLVk/backups?orgId=1
  - name: ShareIntegrity
    rules:
      - alert: Share Integrity Check Failed
        expr: >-
          max by (netbox_device_name, share, bucket_name) (b2_check_failed > 0)
          and on (netbox_device_name)
          (up{instance=~"[0-9.]+:9100", netbox_device_name!=""} == 1)
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.share }} Restic integrity check failed'
          description: 'The last scheduled integrity check of {{ $labels.share }} on {{ $labels.netbox_device_name }} against B2 bucket {{ $labels.bucket_name }} failed. Inspect the check journal; a successful scheduled check clears this failure.'
      - alert: Share Integrity Check Overdue
        expr: >-
          (time() - max by (netbox_device_name, share, bucket_name)
          (b2_check_completed) > 691200)
          and on (netbox_device_name)
          (up{instance=~"[0-9.]+:9100", netbox_device_name!=""} == 1)
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.share }} Restic integrity check overdue'
          description: 'The last successful scheduled integrity check of {{ $labels.share }} on {{ $labels.netbox_device_name }} against B2 bucket {{ $labels.bucket_name }} was over 8 days ago. Checks run weekly on Sunday at 02:00 with up to 30 minutes of jitter and read a rotating quarter of repository data. Inspect the scheduler, backup lock and check journal.'
      - alert: Share Integrity Check Missing
        expr: >-
          (max by (netbox_device_name, share, bucket_name) (b2_check_expected == 1)
          unless on (netbox_device_name, share, bucket_name)
          (max by (netbox_device_name, share, bucket_name) (b2_check_completed)
          or max by (netbox_device_name, share, bucket_name) (b2_check_failed)))
          and on (netbox_device_name)
          (up{instance=~"[0-9.]+:9100", netbox_device_name!=""} == 1)
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.share }} Restic integrity check result missing'
          description: 'Expected repository {{ $labels.share }} on {{ $labels.netbox_device_name }} in B2 bucket {{ $labels.bucket_name }} has no scheduled integrity check result. The check has never run or its result textfile is missing. Inspect the scheduler, backup lock and textfile collector.'
  - name: ShareReplication
    rules:
      - alert: Server Offsite Backup Not Running
        expr: (time() - max(server_backups_offsite_backup_completed{})) / 60 / 60 > 2
        for: 1m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: 'Server Backups not replicated off site'
          description: It has been over 2 hours since the Server Backups has been
            backed up to B2. This job is expected to run hourly.
          dashboard: https://grafana.brickyard.whitestar.systems/d/p1er_aLVk/backups?orgId=1
  - name: NASMaintenance
    rules:
      # Central anchor survives disappearance of the NAS and its discovery target.
      - record: nas:expected_host
        expr: vector(1)
        labels:
          netbox_device_name: WoodlandPark
      - alert: NAS Maintenance Target Missing
        expr: >-
          nas:expected_host unless on (netbox_device_name)
          (up{instance=~"[0-9.]+:9100", netbox_device_name!=""} == 1)
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.netbox_device_name }} maintenance monitoring target missing'
          description: The expected NAS node exporter is down or absent from discovery. Scrub and SMART health cannot be verified.
      - alert: NAS Maintenance Expectations Missing
        expr: >-
          (nas:expected_host unless on (netbox_device_name) nas_scrub_pool_expected)
          or
          (nas:expected_host unless on (netbox_device_name) nas_smart_disk_expected)
          or
          (nas:expected_host unless on (netbox_device_name) nas_scrub_pool_inventory_count)
          or
          (nas:expected_host unless on (netbox_device_name) nas_smart_disk_inventory_count)
          or
          (max by (netbox_device_name) (nas_scrub_pool_inventory_count)
          != on (netbox_device_name)
          (count by (netbox_device_name)
          (max by (netbox_device_name, pool, guid) (nas_scrub_pool_expected == 1))
          or on (netbox_device_name) (nas:expected_host * 0)))
          or
          (max by (netbox_device_name) (nas_smart_disk_inventory_count)
          != on (netbox_device_name)
          (count by (netbox_device_name)
          (max by (netbox_device_name, disk, role) (nas_smart_disk_expected == 1))
          or on (netbox_device_name) (nas:expected_host * 0)))
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.netbox_device_name }} expected maintenance inventory missing'
          description: Expected pool/disk metadata or independent inventory counts are missing or disagree. Missing health series cannot be trusted.
      - alert: NAS Scrub Telemetry Missing
        expr: >-
          nas_scrub_pool_expected unless on (netbox_device_name, pool, guid)
          (nas_scrub_collector_success
          and on (netbox_device_name, pool, guid) nas_scrub_observed_timestamp_seconds
          and on (netbox_device_name, pool, guid) nas_scrub_last_success_timestamp_seconds
          and on (netbox_device_name, pool, guid) nas_scrub_last_scan_failed
          and on (netbox_device_name, pool, guid) nas_zpool_healthy)
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.pool }} scrub telemetry missing'
          description: 'Expected pool {{ $labels.pool }} on {{ $labels.netbox_device_name }} has no scrub collector series.'
      - alert: NAS Scrub Collector Failed
        expr: nas_scrub_collector_success == 0
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.pool }} scrub history unreadable'
          description: 'The scrub collector on {{ $labels.netbox_device_name }} cannot verify pool identity, scan state or durable history. Inspect the journal.'
      - alert: NAS Pool Unhealthy
        expr: nas_zpool_healthy == 0
        for: 1m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.pool }} pool is unhealthy'
          description: 'Pool {{ $labels.pool }} on {{ $labels.netbox_device_name }} is not verified ONLINE. Inspect zpool status and the collector journal.'
      - alert: NAS Scrub Telemetry Stale
        expr: time() - nas_scrub_observed_timestamp_seconds > 900
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.pool }} scrub telemetry stale'
          description: 'Pool {{ $labels.pool }} on {{ $labels.netbox_device_name }} has not been observed successfully for over 15 minutes.'
      - alert: NAS Successful Scrub Overdue
        # Debian cron runs on the second Sunday: intervals can be 35 days.
        # Allow 3 days for completion; this is NOT TrueNAS's 35-day start gate.
        expr: >-
          (nas_scrub_last_success_timestamp_seconds == 0)
          or (time() - nas_scrub_last_success_timestamp_seconds > 3283200)
        for: 1h
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.pool }} has no recent successful full scrub'
          description: 'Pool {{ $labels.pool }} on {{ $labels.netbox_device_name }} has no verified successful full scrub within 38 days. Running, paused, cancelled, error-only scans and resilvers do not reset this deadline.'
      - alert: NAS Scrub Failed
        expr: (nas_scrub_last_scan_failed == 1) or (nas_scrub_last_scan_errors > 0)
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.pool }} full scrub failed'
          description: 'The last full scrub of {{ $labels.pool }} on {{ $labels.netbox_device_name }} was cancelled or completed with errors. A later resilver does not clear this failure.'
      - alert: NAS SMART Failed
        expr: nas_smart_health_failed == 1
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.disk }} SMART health failed'
          description: 'Disk {{ $labels.disk }} ({{ $labels.role }}) on {{ $labels.netbox_device_name }} reports failed SMART health or a current threshold failure.'
      - alert: NAS SMART Unreadable
        expr: nas_smart_collector_success == 0
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.disk }} SMART unreadable'
          description: 'Disk {{ $labels.disk }} ({{ $labels.role }}) on {{ $labels.netbox_device_name }} cannot be read or its serial does not match the expected by-id identity.'
      - alert: NAS SMART Telemetry Missing
        expr: >-
          nas_smart_disk_expected unless on (netbox_device_name, disk, role)
          ((nas_smart_collector_success == 0) or
          (nas_smart_collector_success
          and on (netbox_device_name, disk, role) nas_smart_health_failed
          and on (netbox_device_name, disk, role) nas_smart_observed_timestamp_seconds))
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.disk }} SMART telemetry missing'
          description: 'Expected disk {{ $labels.disk }} ({{ $labels.role }}) on {{ $labels.netbox_device_name }} has no SMART collector series.'
      - alert: NAS SMART Telemetry Stale
        expr: time() - nas_smart_observed_timestamp_seconds > 900
        for: 10m
        labels:
          severity: high
          notify: todoist email-tom
        annotations:
          summary: '{{ $labels.disk }} SMART telemetry stale'
          description: 'Disk {{ $labels.disk }} ({{ $labels.role }}) on {{ $labels.netbox_device_name }} has not been read successfully for over 15 minutes.'
