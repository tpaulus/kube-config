---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-bunny-prod
spec:
  acme:
    email: admin@whitestar.systems
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-issuer-account-key
    solvers:
      - dns01:
          webhook:
            groupName: bunny.aardbol.dev
            solverName: bunny
            config:
              secretRef: bunny-acme-api-token
              secretNamespace: cert-manager
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: bunny-acme-api-token
spec:
  itemPath: vaults/K3S/items/K3S-Bunny-DNS-Sync
