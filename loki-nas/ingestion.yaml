---
# NAS-only ingestion. No queries, admin API or alternate HTTP entrypoint.
# Use the cluster's wildcard certificate from the default TLSStore.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nas-only
  namespace: loki
spec:
  ipAllowList:
    sourceRange:
      - 10.0.10.32/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki-nas
  namespace: loki
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: >-
        Host(`loki-nas.ing.k3s.brickyard.whitestar.systems`)
        && Path(`/otlp/v1/logs`) && Method(`POST`)
      middlewares:
        - name: nas-only
      services:
        - name: loki
          port: 3100
  tls: {}
