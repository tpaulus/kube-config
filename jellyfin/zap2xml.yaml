apiVersion: v1
kind: ConfigMap
metadata:
  name: zap2xml-config
  namespace: jellyfin
data:
  TZ: America/Los_Angeles
  COUNTRY: USA
  LINEUP_ID: USA-OTA98155
  POSTAL_CODE: "98155"
  OUTPUT_FILE: /xmltv/xmltv.xml
  SLEEP_TIME: "43200"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zap2xml-nginx
  namespace: jellyfin
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      root /usr/share/nginx/html;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = /xmltv.xml {
        default_type application/xml;
        try_files /xmltv.xml =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zap2xml
  namespace: jellyfin
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: zap2xml
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zap2xml
    spec:
      automountServiceAccountToken: false
      containers:
        - name: zap2xml
          image: ghcr.io/jesmannstl/zap2xml:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: zap2xml-config
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 25m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /xmltv
        - name: web
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /xmltv.xml
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: zap2xml-nginx
        - name: tmp
          emptyDir: {}
      dnsConfig:
        nameservers: [1.1.1.1, 1.0.0.1]
      dnsPolicy: None
---
apiVersion: v1
kind: Service
metadata:
  name: zap2xml
  namespace: jellyfin
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: zap2xml
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zap2xml
  namespace: jellyfin
spec:
  ingressClassName: traefik
  rules:
    - host: zap2xml.ing.k3s.brickyard.whitestar.systems
      http:
        paths:
          - backend:
              service:
                name: zap2xml
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - zap2xml.ing.k3s.brickyard.whitestar.systems
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zap2xml-public
  namespace: jellyfin
  annotations:
    external-dns.kubernetes.io/target: lfp.it.paulus.family
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web-mtls
spec:
  ingressClassName: traefik
  rules:
    - host: zap2xml.it.paulus.family
      http:
        paths:
          - backend:
              service:
                name: zap2xml
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - zap2xml.it.paulus.family
