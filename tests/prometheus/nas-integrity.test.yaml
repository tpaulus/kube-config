---
rule_files:
  - ../../_alerts/nas.yaml
evaluation_interval: 1m

tests:
  - name: Healthy results cover all expected repositories despite scrape labels
    interval: 1m
    input_series:
      - series: 'up{job="netbox-devices",instance="10.0.0.1:9100",netbox_device_name="WoodlandPark"}'
        values: '1+0x20'
      - series: 'b2_check_expected{job="netbox-devices",instance="10.0.0.1:9100",netbox_device_name="WoodlandPark",share="Photos",bucket_name="brickyard-woodlandpark-restic",file="expected.prom"}'
        values: '1+0x20'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="Docs",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="Mel",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="Tom",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="Archive",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="Jellyfin",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="Prometheus",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="WebDAV",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_completed{job="netbox-devices",instance="10.0.0.1:9100",netbox_device_name="WoodlandPark",share="Photos",bucket_name="brickyard-woodlandpark-restic",file="Photos-check.prom"}'
        values: '1+0x20'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Docs",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Mel",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Tom",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Archive",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Jellyfin",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Prometheus",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="WebDAV",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*"}'
        eval_time: 20m
        exp_samples: []

  - name: Failed-only results fire once per repository and recover on success
    interval: 1m
    input_series:
      - series: 'up{job="netbox-devices",instance="10.0.0.1:9100",netbox_device_name="WoodlandPark"}'
        values: '1+0x21'
      - series: 'up{job="duplicate",instance="10.0.0.2:9100",netbox_device_name="WoodlandPark"}'
        values: '1+0x21'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="Photos",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x21'
      - series: 'b2_check_failed{job="netbox-devices",instance="10.0.0.1:9100",netbox_device_name="WoodlandPark",share="Photos",bucket_name="brickyard-woodlandpark-restic",file="Photos-check.prom"}'
        values: '1+0x10 stale'
      - series: 'b2_check_failed{job="duplicate",instance="10.0.0.2:9100",netbox_device_name="WoodlandPark",share="Photos",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x10 stale'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Photos",bucket_name="brickyard-woodlandpark-restic"}'
        values: '_x11 660+0x10'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*",alertstate="firing"}'
        eval_time: 9m
        exp_samples: []
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*",alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="Share Integrity Check Failed",alertstate="firing",netbox_device_name="WoodlandPark",share="Photos",bucket_name="brickyard-woodlandpark-restic",severity="high",notify="todoist email-tom"}'
            value: 1
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*"}'
        eval_time: 11m
        exp_samples: []
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*"}'
        eval_time: 21m
        exp_samples: []

  - name: Overdue threshold is strictly greater than eight days plus hold time
    interval: 1m
    input_series:
      - series: 'up{job="netbox-devices",instance="10.0.0.1:9100",netbox_device_name="WoodlandPark"}'
        values: '1+0x11532'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="Archive",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x11532'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Archive",bucket_name="brickyard-woodlandpark-restic"}'
        values: '0+0x11532'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*"}'
        eval_time: 192h
        exp_samples: []
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*",alertstate="firing"}'
        eval_time: 192h10m
        exp_samples: []
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*",alertstate="firing"}'
        eval_time: 192h11m
        exp_samples:
          - labels: 'ALERTS{alertname="Share Integrity Check Overdue",alertstate="firing",netbox_device_name="WoodlandPark",share="Archive",bucket_name="brickyard-woodlandpark-restic",severity="high",notify="todoist email-tom"}'
            value: 1

  - name: Never-run repository is not masked by other shares buckets or hosts
    interval: 1m
    input_series:
      - series: 'up{job="netbox-devices",instance="10.0.0.1:9100",netbox_device_name="WoodlandPark"}'
        values: '1+0x20'
      - series: 'b2_check_expected{job="netbox-devices",instance="10.0.0.1:9100",netbox_device_name="WoodlandPark",share="Docs",bucket_name="brickyard-woodlandpark-restic",file="expected.prom"}'
        values: '1+0x20'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="Disabled",bucket_name="brickyard-woodlandpark-restic"}'
        values: '0+0x20'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Photos",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Docs",bucket_name="another-bucket"}'
        values: '1+0x20'
      - series: 'b2_check_completed{netbox_device_name="another-host",share="Docs",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*",alertstate="firing"}'
        eval_time: 9m
        exp_samples: []
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*",alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="Share Integrity Check Missing",alertstate="firing",netbox_device_name="WoodlandPark",share="Docs",bucket_name="brickyard-woodlandpark-restic",severity="high",notify="todoist email-tom"}'
            value: 1

  - name: Disappearing result textfile is detected using independent expectations
    interval: 1m
    input_series:
      - series: 'up{job="netbox-devices",instance="10.0.0.1:9100",netbox_device_name="WoodlandPark"}'
        values: '1+0x20'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="WebDAV",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x20'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="WebDAV",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x4 stale'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*",alertstate="firing"}'
        eval_time: 14m
        exp_samples: []
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*",alertstate="firing"}'
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="Share Integrity Check Missing",alertstate="firing",netbox_device_name="WoodlandPark",share="WebDAV",bucket_name="brickyard-woodlandpark-restic",severity="high",notify="todoist email-tom"}'
            value: 1

  - name: Exporter down absent or wrong port suppresses repository alerts
    interval: 1m
    input_series:
      - series: 'up{job="netbox-devices",instance="10.0.0.1:9100",netbox_device_name="WoodlandPark"}'
        values: '0+0x20 stale'
      - series: 'up{job="netbox-devices",instance="10.0.0.1:9090",netbox_device_name="WoodlandPark"}'
        values: '1+0x40'
      - series: 'up{job="netbox-devices",instance="10.0.0.2:9100",netbox_device_name="another-host"}'
        values: '1+0x40'
      - series: 'b2_check_expected{netbox_device_name="WoodlandPark",share="Missing",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x40'
      - series: 'b2_check_failed{netbox_device_name="WoodlandPark",share="Failed",bucket_name="brickyard-woodlandpark-restic"}'
        values: '1+0x40'
      - series: 'b2_check_completed{netbox_device_name="WoodlandPark",share="Overdue",bucket_name="brickyard-woodlandpark-restic"}'
        values: '-700000+0x40'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*"}'
        eval_time: 20m
        exp_samples: []
      - expr: 'ALERTS{alertname=~"Share Integrity Check .*"}'
        eval_time: 40m
        exp_samples: []
