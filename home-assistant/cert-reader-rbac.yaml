---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-assistant-cert-reader
  namespace: home-assistant
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: home-assistant-cert-reader-secret
  annotations:
    kubernetes.io/service-account.name: home-assistant-cert-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-assistant-cert-reader
  namespace: home-assistant
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["home-assistant-tls"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-assistant-cert-reader
  namespace: home-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-assistant-cert-reader
subjects:
  - kind: ServiceAccount
    name: home-assistant-cert-reader
    namespace: home-assistant
