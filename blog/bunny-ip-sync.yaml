---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bunny-ip-sync
  namespace: blog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bunny-ip-sync
  namespace: blog
rules:
  - apiGroups: [traefik.io]
    resources: [middlewares]
    resourceNames: [blog-bunny-ip-allowlist]
    verbs: [patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [bunny-ip-sync]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bunny-ip-sync
  namespace: blog
subjects:
  - kind: ServiceAccount
    name: bunny-ip-sync
    namespace: blog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bunny-ip-sync
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: blog-bunny-ip-allowlist
  namespace: blog
spec:
  ipAllowList:
    # Fail closed until the first successful Bunny node-list sync.
    sourceRange: ["127.0.0.1/32", "::1/128"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bunny-ip-sync-postsync
  namespace: blog
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: bunny-ip-sync
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
        - name: trigger
          image: alpine/k8s:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              name="bunny-ip-sync-run-$(date +%s)"
              kubectl -n blog create job --from=cronjob/bunny-ip-sync "${name}"
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bunny-ip-sync
  namespace: blog
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: bunny-ip-sync
          restartPolicy: OnFailure
          dnsConfig:
            nameservers: [1.1.1.1, 1.0.0.1]
          dnsPolicy: None
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              command: [/bin/sh, -ec]
              args:
                - |
                  response="$(curl --fail --silent --show-error https://api.bunny.net/mc/nodes/plain)"
                  ranges=
                  while IFS= read -r address; do
                    test -n "$address" || continue
                    case "$address" in
                      *[!0-9.]* | .* | *.) exit 1 ;;
                    esac
                    old_ifs=$IFS
                    IFS=.
                    set -- $address
                    IFS=$old_ifs
                    test "$#" -eq 4
                    for octet; do
                      case "$octet" in
                        '' | *[!0-9]*) exit 1 ;;
                      esac
                      test "$octet" -le 255
                    done
                    cidr="${address}/32"
                    ranges="${ranges}${ranges:+,}\"${cidr}\""
                  done <<EOF
                  $response
                  EOF
                  test -n "$ranges"
                  token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  auth="$(printf '%s %s' Bearer "$token")"
                  curl --fail --silent --show-error \
                    --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                    -H "Authorization: ${auth}" \
                    -H 'Content-Type: application/merge-patch+json' \
                    --data "{\"spec\":{\"ipAllowList\":{\"sourceRange\":[${ranges}]}}}" \
                    -X PATCH \
                    "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}/apis/traefik.io/v1alpha1/namespaces/blog/middlewares/blog-bunny-ip-allowlist"
