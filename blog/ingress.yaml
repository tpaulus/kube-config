---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: inject-headers
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ghost-admin-fail2ban
spec:
  plugin:
    fail2ban:
      sourceCriterion:
        requestHeaderName: X-Real-IP
      rules:
        bantime: 1h
        findtime: 10m
        maxretry: 5
        enabled: true
        statuscode: "401,403"
      enableBlockLogs: true
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: no-client-cert
spec:
  minVersion: VersionTLS12
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-bunny
  annotations:
    external-dns.kubernetes.io/target: lfp.it.paulus.family
    internal.paulus.family/controller: external-dns
    traefik.ingress.kubernetes.io/router.entrypoints: web-mtls
    traefik.ingress.kubernetes.io/router.middlewares: blog-blog-bunny-ip-allowlist@kubernetescrd,blog-inject-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls.options: blog-no-client-cert@kubernetescrd
spec:
  tls:
    - hosts:
        - blog.tompaulus.com
      secretName: blog-tompaulus-com-cert
  rules:
    - host: blog.tompaulus.com
      http:
        paths:
          - backend:
              service:
                name: ghost
                port:
                  number: 2368
            path: /
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-bunny-admin
  annotations:
    external-dns.kubernetes.io/target: lfp.it.paulus.family
    internal.paulus.family/controller: external-dns
    traefik.ingress.kubernetes.io/router.entrypoints: web-mtls
    traefik.ingress.kubernetes.io/router.middlewares: blog-blog-bunny-ip-allowlist@kubernetescrd,blog-ghost-admin-fail2ban@kubernetescrd,blog-inject-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.tls.options: blog-no-client-cert@kubernetescrd
spec:
  tls:
    - hosts:
        - blog.tompaulus.com
      secretName: blog-tompaulus-com-cert
  rules:
    - host: blog.tompaulus.com
      http:
        paths:
          - backend:
              service:
                name: ghost
                port:
                  number: 2368
            path: /ghost
            pathType: Prefix
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: blog-tompaulus-com-cert
spec:
  secretName: blog-tompaulus-com-cert
  duration: 2160h0m0s
  dnsNames:
    - blog.tompaulus.com
  issuerRef:
    name: letsencrypt-cf-prod
    kind: ClusterIssuer
