---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: inject-headers
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-bunny
  annotations:
    external-dns.kubernetes.io/target: lfp.it.paulus.family
    internal.paulus.family/controller: external-dns
    traefik.ingress.kubernetes.io/router.entrypoints: web-ext
    traefik.ingress.kubernetes.io/router.middlewares: blog-bunny-ip-allowlist@kubernetescrd,blog-inject-headers@kubernetescrd
spec:
  tls:
    - hosts:
        - blog.tompaulus.com
      secretName: blog-tompaulus-com-cert
  rules:
    - host: blog.tompaulus.com
      http:
        paths:
          - backend:
              service:
                name: ghost
                port:
                  number: 2368
            path: /
            pathType: Prefix
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: blog-tompaulus-com-cert
spec:
  secretName: blog-tompaulus-com-cert
  duration: 2160h0m0s
  dnsNames:
    - blog.tompaulus.com
  issuerRef:
    name: letsencrypt-cf-prod
    kind: ClusterIssuer
