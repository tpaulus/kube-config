apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: photos-it-paulus-family
  namespace: immich
spec:
  secretName: photos-it-paulus-family-cert
  duration: 2160h0m0s
  dnsNames:
    - photos.it.paulus.family
  issuerRef:
    name: letsencrypt-bunny-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
  annotations:
    external-dns.kubernetes.io/target: lfp.it.paulus.family
spec:
  tls:
    - hosts:
        - photos.it.paulus.family
      secretName: photos-it-paulus-family-cert
  rules:
    - host: photos.it.paulus.family
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
