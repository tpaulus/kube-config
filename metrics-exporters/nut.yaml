---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut-exporter-compute-ups
  labels:
    app: nut-exporter-compute-ups
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nut-exporter-compute-ups
  template:
    metadata:
      labels:
        app: nut-exporter-compute-ups
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9199'
        prometheus.io/path: /ups_metrics
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nut-exporter-compute-ups
          image: ghcr.io/druggeri/nut_exporter:3.3.0
          ports:
            - containerPort: 9199
              name: metrics
          resources:
            requests:
              memory: 256Mi
              cpu: 64m
            limits:
              memory: 256Mi
              cpu: 64m
          envFrom:
            - secretRef:
                name: nut-config
          env:
            - name: NUT_EXPORTER_VARIABLES
              value: battery.charge,battery.voltage,battery.voltage.nominal,battery.runtime,input.voltage,input.voltage.nominal,ups.load,ups.status
            - name: NUT_EXPORTER_SERVER
              value: '10.0.10.32'
          livenessProbe:
            tcpSocket:
              port: 9199
          readinessProbe:
            tcpSocket:
              port: 9199
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
---
