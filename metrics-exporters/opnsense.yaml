---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-opnsense-exporter
  labels:
    app: prometheus-opnsense-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: prometheus-opnsense-exporter
  template:
    metadata:
      labels:
        app: prometheus-opnsense-exporter
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/scrape_interval: 1m
        prometheus.io/scrape_timeout: 50s
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prometheus-opnsense-exporter
          image: ghcr.io/athennamind/opnsense-exporter:0.0.19
          ports:
            - containerPort: 8080
              name: metrics
          resources:
            requests:
              memory: 256Mi
              cpu: 64m
            limits:
              memory: 256Mi
              cpu: 64m
          args:
            - --opnsense.protocol=https
            - --opnsense.address=10.0.10.1
            - --opnsense.insecure
            - --exporter.instance-label=opnsense
          env:
            - name: OPNSENSE_EXPORTER_OPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opnsense-creds
                  key: OPNSENSE_KEY
            - name: OPNSENSE_EXPORTER_OPS_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: opnsense-creds
                  key: OPNSENSE_SECRET
          livenessProbe:
            tcpSocket:
              port: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: opnsense-creds
spec:
  itemPath: vaults/K3S/items/OPNSense-Exporter
