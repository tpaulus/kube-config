---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ansible-apply
  namespace: ansible-runner
spec:
  schedule: "0 3 */5 * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ansible-runner
        spec:
          serviceAccountName: ansible-runner
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ansible
              image: ghcr.io/tpaulus/ansible-runner:gitops@sha256:438a65162a3f4ca11bbe02fa561bcf02d410a9386c3131fef73f6703bb71f514
              args: [run, scheduled]
              envFrom:
                - configMapRef:
                    name: ansible-runner
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: NETBOX_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ansible-runner-auth
                      key: NETBOX_TOKEN
                - name: ANSIBLE_REMOTE_USER
                  valueFrom:
                    secretKeyRef:
                      name: ansible-runner-auth
                      key: ANSIBLE_REMOTE_USER
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: credentials
                  mountPath: /secrets
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: work
                  mountPath: /home/runner
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: credentials
              projected:
                defaultMode: 0440
                sources:
                  - secret:
                      name: ansible-applier-ssh-key
                      items:
                        - key: private-key
                          path: ssh_key
                  - secret:
                      name: ansible-runner-auth
                      items:
                        - key: vault_password
                          path: vault_password
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
