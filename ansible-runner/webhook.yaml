---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-webhook
  namespace: ansible-runner
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ansible-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ansible-webhook
    spec:
      serviceAccountName: ansible-webhook
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: ghcr.io/tpaulus/ansible-runner:gitops@sha256:438a65162a3f4ca11bbe02fa561bcf02d410a9386c3131fef73f6703bb71f514
          args: [serve]
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ansible-webhook-auth
                  key: WEBHOOK_SECRET
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ansible-webhook
  namespace: ansible-runner
spec:
  selector:
    app.kubernetes.io/name: ansible-webhook
  ports:
    - name: http
      port: 9000
      targetPort: http
