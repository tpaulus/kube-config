---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: github-webhook
  namespace: ansible-runner
spec:
  minVersion: VersionTLS12
  clientAuth:
    clientAuthType: NoClientCert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ansible-webhook
  namespace: ansible-runner
  annotations:
    external-dns.kubernetes.io/target: lfp.it.paulus.family
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web-mtls
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: ansible-runner-github-webhook@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ansible-webhook.ing.k3s.brickyard.whitestar.systems
      http:
        paths:
          - path: /hooks/ansible
            pathType: Exact
            backend:
              service:
                name: ansible-webhook
                port:
                  number: 9000
  tls:
    - hosts:
        - ansible-webhook.ing.k3s.brickyard.whitestar.systems
