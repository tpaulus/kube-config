---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ansible-runner
  namespace: ansible-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ansible-webhook
  namespace: ansible-runner
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: ansible-apply
  namespace: ansible-runner
spec:
  leaseDurationSeconds: 18000
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ansible-runner
  namespace: ansible-runner
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [ansible-apply]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ansible-webhook
  namespace: ansible-runner
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [ansible-apply]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ansible-runner
  namespace: ansible-runner
subjects:
  - kind: ServiceAccount
    name: ansible-runner
    namespace: ansible-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ansible-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ansible-webhook
  namespace: ansible-runner
subjects:
  - kind: ServiceAccount
    name: ansible-webhook
    namespace: ansible-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ansible-webhook
