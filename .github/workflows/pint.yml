---
name: pint
on:
  push:
    branches: [main]
    paths: [_alerts/**]
  pull_request:
    branches: [main]
    paths: [_alerts/**]
permissions:
  pull-requests: write
jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run pint
        uses: prymitive/pint-action@ae2a0adcf773d6d7974048954ca3facb4fa9f54d # v1.117
        with:
          token: ${{ github.token }}
        env:
          WORKDIR: _alerts/
