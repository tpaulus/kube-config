---
name: pint
on:
  push:
    branches: [main]
    paths: [_alerts/**, tests/prometheus/**, .github/workflows/pint.yml]
  pull_request:
    branches: [main]
    paths: [_alerts/**, tests/prometheus/**, .github/workflows/pint.yml]
permissions:
  pull-requests: write
jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run pint
        uses: prymitive/pint-action@faa8e4e1eba865b77b5bd785be318107c4e19e6a # v1.119
        with:
          token: ${{ github.token }}
        env:
          WORKDIR: _alerts/
