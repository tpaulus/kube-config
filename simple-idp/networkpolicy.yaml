---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: simple-idp
  namespace: simple-idp
spec:
  podSelector:
    matchLabels:
      app: simple-idp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr-stack
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr-stack
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
