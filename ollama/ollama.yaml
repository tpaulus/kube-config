---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ollama
        image: ollama/ollama:0.40.14
        command: ["/bin/sh", "-c"]
        # Serve, then pull the models (no-op if already on the PVC).
        args:
          - |
            ollama serve &
            until ollama list >/dev/null 2>&1; do sleep 1; done
            for m in $MODELS; do ollama pull "$m"; done
            wait
        env:
        - name: MODELS
          value: "qwen2.5:3b nomic-embed-text"
        - name: HOME
          value: /tmp
        - name: OLLAMA_MODELS
          value: /models
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        - name: OLLAMA_CONTEXT_LENGTH
          value: "8192"
        - name: OLLAMA_KEEP_ALIVE
          value: 30m
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "2"
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: 500m
            memory: 3Gi
          limits:
            cpu: "8"
            memory: 6Gi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - for m in $MODELS; do ollama show "$m" >/dev/null || exit 1; done
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 11434
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: models
          mountPath: /models
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
