---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: n8n-it-paulus-family
  namespace: n8n
spec:
  secretName: n8n-it-paulus-family-cert
  duration: 2160h0m0s
  dnsNames:
    - n8n.it.paulus.family
  issuerRef:
    name: letsencrypt-cf-prod
    kind: ClusterIssuer
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: n8n
  labels:
    app: n8n
    component: service
spec:
  selector:
    app: n8n
    component: deployment
  ports:
    - protocol: TCP
      name: http
      port: 80
      targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: n8n
spec:
  rules:
    - host: n8n.ing.k3s.brickyard.whitestar.systems
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-public
  namespace: n8n
  annotations:
    external-dns.kubernetes.io/target: lfp.it.paulus.family
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web-mtls
spec:
  tls:
    - hosts:
        - n8n.it.paulus.family
      secretName: n8n-it-paulus-family-cert
  rules:
    - host: n8n.it.paulus.family
      http:
        paths:
          - backend:
              service:
                name: n8n-service
                port:
                  number: 80
            path: /
            pathType: Prefix
